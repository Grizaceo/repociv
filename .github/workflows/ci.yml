name: ci

on:
  push:
    branches: [main, feat/**, fix/**, refactor/**, chore/**]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python deps
        # Install the exact lock (ruff, mypy and pytest included), not the
        # floors in requirements.txt: CI must test what deploys, and a fresh
        # resolve could silently pick up a release from yesterday.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run gate
        # The same script we use locally — single source of truth.
        run: bash scripts/check.sh

  # ── Playwright e2e (blocking) ──────────────────────────────────────────────
  # Boots bridge + vite via playwright.config webServer. Golden hash comparison
  # stays informative (GPU-dependent); the step below uses `|| true`.
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    # 48 specs on 2 workers: ~25-35 min once the demo workspace seed lets the
    # suite actually run (the previous 20-minute cap killed it mid-flight).
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install JS deps
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed demo workspace state for e2e
        # A fresh runner has no active map root and no repo selection, so the
        # UI opens the picker wizard and the map is empty — most specs then
        # fail on missing elements. Seed the state the bridge and the Vite
        # plugin share, pointing at the synthetic demo workspace shipped in
        # the repo (the same fixture the judge demo uses).
        env:
          REPOCIV_MAP_ROOT: ${{ github.workspace }}/demo-workspace
          REPOCIV_STATE_FILE: ${{ github.workspace }}/.e2e-state.json
        run: |
          node -e '
            const fs = require("node:fs");
            const root = process.env.REPOCIV_MAP_ROOT;
            const repos = fs.readdirSync(root, { withFileTypes: true })
              .filter((d) => d.isDirectory() && !d.name.startsWith("."))
              .map((d) => `${root}/${d.name}`)
              .sort();
            const now = new Date().toISOString();
            fs.writeFileSync(process.env.REPOCIV_STATE_FILE, JSON.stringify({
              version: 1,
              activeRoot: root,
              roots: { [root]: { selectedRepoPaths: repos, addedAt: now, lastSeen: now } },
            }, null, 2));
          '

      - name: Run e2e
        env:
          REPOCIV_MAP_ROOT: ${{ github.workspace }}/demo-workspace
          WORKSPACE_ROOT: ${{ github.workspace }}/demo-workspace
          REPOCIV_REPOS_ROOT: ${{ github.workspace }}/demo-workspace
          REPOCIV_STATE_FILE: ${{ github.workspace }}/.e2e-state.json
        run: npx playwright test

      - name: Run golden captures (informative; GPU-dependent)
        run: |
          npm run dev -- --host 127.0.0.1 --port 5273 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5273 >/dev/null && break
            sleep 2
          done
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:5273 node scripts/screenshot-3d-audit.mjs || true

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-captures
          path: |
            .hermes/artifacts/3d-audit/
            test-results/
          if-no-files-found: ignore
