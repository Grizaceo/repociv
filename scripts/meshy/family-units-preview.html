<!doctype html>
<html lang="es">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RepoCiv · Unidades knowledge-city</title>
  <style>
    body {
      margin: 0;
      background: #202c36;
      color: #eee;
      font: 15px system-ui;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    aside {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 320px;
      padding: 16px;
      background: #18222de8;
      border: 1px solid #b99b63;
      border-radius: 8px;
    }
    p {
      line-height: 1.45;
      margin: 8px 0;
    }
    button,
    select {
      padding: 5px 7px;
      margin: 3px 2px;
      cursor: pointer;
    }
    a {
      color: #e7bd75;
    }
    #status {
      color: #ebc67d;
    }
  </style>
  <aside>
    <strong>RepoCiv · Unidades</strong>
    <p>
      Figurillas Meshy PBR en el mapa. Arrastra para rotar.
    </p>
    <label
      >Oficio
      <select id="asset"></select>
    </label>
    <p id="status">Cargando…</p>
    <div id="views"></div>
    <p>
      <img id="concept" alt="Concepto Meshy" style="width:100%;border-radius:8px;background:#111a21" />
    </p>
    <p>
      <a href="/scripts/meshy/family-textured-preview.html">Familia de edificios</a>
      ·
      <a href="/scripts/meshy/family-textured-preview.html?asset=unit-coordinator">PBR unidades</a>
    </p>
    <small
      >Runtime: copias 512 px en <code>public/assets/3d/props/meshy/*-map.glb</code>. Los CSG
      knowledge-city quedan como fallback.</small>
    >
  </aside>
  <script type="module">
    import * as T from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const ASSETS = {
      'unit-coordinator': {
        label: 'Coordinador',
        url: '/assets/3d/props/meshy/unit-coordinator-map.glb',
        concept: '/assets-src/meshy/unit-coordinator/preview.png',
        maps: 'hero, claude, openclaw',
      },
      'unit-builder': {
        label: 'Constructor · v002',
        url: '/assets/3d/props/meshy/unit-builder-map.glb',
        concept: '/assets-src/meshy/unit-builder/concept-v002/preview.png',
        maps: 'worker, codex, cursor',
      },
      'unit-ranger': {
        label: 'Explorador',
        url: '/assets/3d/props/meshy/unit-ranger-map.glb',
        concept: '/assets-src/meshy/unit-ranger/preview.png',
        maps: 'scout, caravan',
      },
      'unit-guardian': {
        label: 'Guardián',
        url: '/assets/3d/props/meshy/unit-guardian-map.glb',
        concept: '/assets-src/meshy/unit-guardian/preview.png',
        maps: 'praetorian, army, lexo',
      },
    };
    const params = new URLSearchParams(location.search);
    const selected = ASSETS[params.get('asset')] ? params.get('asset') : 'unit-coordinator';
    const select = document.querySelector('#asset');
    for (const [id, a] of Object.entries(ASSETS)) {
      select.append(new Option(a.label, id, false, id === selected));
    }
    select.onchange = () => {
      params.set('asset', select.value);
      location.search = params.toString();
    };
    document.querySelector('#concept').src = ASSETS[selected].concept;

    const scene = new T.Scene();
    scene.background = new T.Color('#202c36');
    scene.add(new T.AmbientLight(0xdacfb6, 0.38), new T.HemisphereLight(0xb0d8f0, 0x7aaa60, 0.34));
    const sun = new T.DirectionalLight(0xffe7bd, 1.3);
    sun.position.set(3, 5, 2);
    scene.add(sun);
    const renderer = new T.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.append(renderer.domElement);
    const camera = new T.PerspectiveCamera(38, 1, 0.01, 100);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.32, 0);
    const views = { iso: [0.9, 0.85, 1.1], front: [0, 0.4, 1.4], left: [-1.4, 0.4, 0], right: [1.4, 0.4, 0] };
    const viewBox = document.querySelector('#views');
    for (const [name, label] of [
      ['iso', 'Perspectiva'],
      ['front', 'Frente'],
      ['left', 'Izquierda'],
      ['right', 'Derecha'],
    ]) {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = () => {
        camera.position.fromArray(views[name]);
        controls.update();
      };
      viewBox.append(b);
    }
    camera.position.fromArray(views.iso);
    const ground = new T.Mesh(
      new T.CylinderGeometry(0.55, 0.55, 0.02, 6),
      new T.MeshStandardMaterial({ color: 0x738057, roughness: 0.95 }),
    );
    ground.position.y = -0.01;
    scene.add(ground);

    new GLTFLoader().load(
      ASSETS[selected].url,
      (gltf) => {
        const model = gltf.scene;
        const bounds = new T.Box3().setFromObject(model);
        const size = bounds.getSize(new T.Vector3());
        const center = bounds.getCenter(new T.Vector3());
        const scale = 0.85 / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(scale);
        model.position.set(-center.x * scale, -bounds.min.y * scale, -center.z * scale);
        let triangles = 0;
        model.traverse((o) => {
          if (o.isMesh) {
            triangles += (o.geometry.index?.count ?? o.geometry.attributes.position.count) / 3;
            o.castShadow = true;
          }
        });
        scene.add(model);
        document.querySelector('#status').textContent =
          `${ASSETS[selected].maps} · ${triangles} triángulos · overlay de ${selected}`;
      },
      undefined,
      () => {
        document.querySelector('#status').textContent = 'No se pudo cargar el GLB.';
      },
    );

    function resize() {
      const panel = innerWidth > 800 ? 360 : 0;
      renderer.domElement.style.marginLeft = `${panel}px`;
      camera.aspect = (innerWidth - panel) / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth - panel, innerHeight);
    }
    addEventListener('resize', resize);
    resize();
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</html>
